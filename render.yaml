services:
  - type: web
    name: polymarket-weather-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: CHECK_INTERVAL_MINUTES
        value: 15
      - key: MAX_INVESTMENT_PER_TRADE
        value: 10
      - key: MIN_LIQUIDITY
        value: 3000
      - key: MAX_PRICE_SUM
        value: 0.96
      - key: MAX_POSITION_SIZE
        value: 50
      - key: DAILY_LOSS_LIMIT
        value: 20
      - key: KELLY_CRITERION_FRACTION
        value: 0.5
      - key: MIN_CONFIDENCE_SCORE
        value: 0.7
      - key: MIN_MODEL_CONSENSUS
        value: 0.8
      - key: TEMPERATURE_RANGE
        value: 1
      - key: ENABLE_ML_PREDICTIONS
        value: false
      - key: LOG_LEVEL
        value: INFO
    autoDeploy: true
